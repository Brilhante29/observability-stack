name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    permissions:
      contents: read
    uses: Brilhante29/ci-cd-templates/.github/workflows/reusable-python.yml@bc591185eeb3ec73ff550fa6b1fdf4d41885a55e

  correlated-signals:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Compose models
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.evidence.yml config --quiet
      - name: Run correlated-signal benchmark
        env:
          BENCHMARK_OUTPUT: /output/ci.json
        run: >-
          docker compose -f docker-compose.evidence.yml
          up --build --abort-on-container-exit --exit-code-from benchmark
      - name: Copy benchmark result
        run: >-
          docker compose -f docker-compose.evidence.yml
          cp benchmark:/output/ci.json benchmarks/results/ci.json
      - name: Validate benchmark contract
        run: python tools/validate_benchmark.py benchmarks/results/ci.json
      - name: Validate publication evidence
        run: python tools/validate-publication.py
      - name: Tear down evidence stack
        if: always()
        run: docker compose -f docker-compose.evidence.yml down --volumes
