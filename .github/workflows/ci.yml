name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Lint
        run: ruff check src tests
      - name: Validate benchmark evidence
        env:
          PYTHONPATH: src
        run: |
          python -m observability_stack.benchmark --output benchmarks/results/ci.json
          python -m json.tool benchmarks/results/ci.json > /dev/null
      - name: Build Docker image
        run: docker build --tag observability-stack:ci .
