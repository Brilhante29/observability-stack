receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 100ms

exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  file/traces:
    path: /evidence/traces.json
    flush_interval: 100ms
  file/logs:
    path: /evidence/logs.json
    flush_interval: 100ms

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/tempo, file/traces]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, file/logs]
