id: 25
name: observability-stack
program:
  id: delivery-observability-infra
  narrative_fit: "Proves one local incident correlated across metrics, traces, and logs, with a dashboard and a fail-closed benchmark."
  shared_assets:
    - "Portfolio benchmark JSON contract"
    - "Reusable workflow skill and per-profile CI"
status: published
claim: end-to-end observability with three-signal correlation
stack:
  - python-3.12
  - fastapi
  - opentelemetry-sdk
  - opentelemetry-collector
  - prometheus
  - tempo
  - loki
  - grafana
  - docker-compose
language_profile:
  primary: fastapi-backend
  secondary: []
  reason: "FastAPI keeps the workload small; OpenTelemetry standardizes traces and logs without coupling the domain to a backend."
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: delivery-observability-infra
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker-compose
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: recorded
  principles:
    coupling_rule: "Domain and use cases import neither FastAPI, OpenTelemetry, Prometheus, storage, a broker, nor a cloud SDK."
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: "Use a modular monolith and add only the backends that prove metrics, traces, logs, and navigation between signals."
    testability_rule: "ObservationService receives IncidentStore and Clock; telemetry is composed in the HTTP adapter."
    rejected_overengineering:
      - "Microservices and a broker were rejected because there is no fan-out, queue, or independent deployment."
      - "A database was rejected because persistence is not part of the claim."
  stack_profile: fastapi-backend
  api_style: rest-http
  messaging: none
  cloud:
    mode: local-first
    local_provider: docker-compose
    real_provider_target: pluggable-otlp-backend
    emulated_services: []
    adapter_rule: "The application speaks OTLP; the Collector and backends can be swapped without changing the domain or use cases."
    config_switch: OTEL_EXPORTER_OTLP_ENDPOINT
    unsupported_behaviors:
      - "No parity with production SLOs, retention, or high availability is claimed."
  database: none
  runtime: "Python 3.12.13 without root; Compose pins images by tag and digest."
  library_policy: "Direct Python dependencies are pinned; external integrations use OTLP and configuration, not imports in the domain."
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: "Prometheus and Grafana only"
      reason: "It would not prove correlation across metrics, traces, and logs."
    - option: "Kafka or RabbitMQ"
      reason: "There is no messaging requirement in this synchronous flow."
architecture:
  style: hexagonal-modular-monolith
  reason: "The incident is one small domain; ports isolate state and time, while HTTP and telemetry stay in the adapters."
  problem_forces:
    domain_complexity: low
    integration_pressure: high
    ui_state_complexity: none
    data_or_ml_reproducibility: high
    auditability: high
    throughput_or_async: low
    independent_deployability: low
  dependency_rule: "Dependencies point inward; observability backends receive signals through OTLP or scraping."
  boundaries:
    - "domain.py: identity, invariants, and immutable transitions"
    - "application.py: use cases over IncidentStore and Clock"
    - "infrastructure: store, metrics, and telemetry"
    - "api.py: HTTP composition and correlation"
    - "benchmark.py: fail-closed external consumer"
  rejected_alternatives:
    - style: microservices
      reason: "Distribution would add failures without increasing the signal evidence."
    - style: event-driven
      reason: "There is no asynchronous processing or fan-out."
design_system:
  tokens: .portfolio/design-system/tokens.yaml
  readme_components:
    - readme_header
    - benchmark_card
    - architecture_card
    - references_table
  diagram_required: true
reuse:
  kit_version: portfolio-reuse-kit@845560aa0f0704e8e8c6f6c4f98ba50d083b12a5
  uses:
    - catalog
    - programs
    - component-packs
    - openspec-schema
    - decision-brain
    - agent-graph
    - reuse-improvement-loop
    - architecture
    - language-profiles
    - design-system
    - sdd
    - harness
    - templates
    - skills
    - observability-evidence-v1
    - observability-evidence-harness
benchmark:
  primary_metric: incident_recovery_seconds
  unit: seconds
  command: "docker compose -f docker-compose.evidence.yml up --build --abort-on-container-exit --exit-code-from benchmark; docker compose -f docker-compose.evidence.yml cp benchmark:/output/observability-stack-v1.json benchmarks/results/observability-stack-v1.json"
  result_path: benchmarks/results/observability-stack-v1.json
  publication_result_path: benchmarks/publication/observability-stack-v2.json
release:
  docker: "docker compose up --build"
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
  evidence_source_commit: 2b289f4554d5f976f45d0126816d93490811f34d
  evidence_image_digest: sha256:a28b8b6e2f27aa4ed1d06c905bf59dc1448704b834c68bfffe590fd1c52b25a6
  evidence_image_size_bytes: 144984285
