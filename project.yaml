id: 25
name: observability-stack
program:
  id: delivery-observability-infra
  narrative_fit: "Prova um incidente local correlacionado em metricas, traces e logs, com dashboard e benchmark fail-closed."
  shared_assets:
    - "Contrato de benchmark JSON do portfolio"
    - "Skill de workflow reutilizavel e CI por perfil"
status: published
claim: observabilidade ponta a ponta com correlacao de tres sinais
stack:
  - python-3.12
  - fastapi
  - opentelemetry-sdk
  - opentelemetry-collector
  - prometheus
  - tempo
  - loki
  - grafana
  - docker-compose
language_profile:
  primary: fastapi-backend
  secondary: []
  reason: "FastAPI mantem o workload pequeno; OpenTelemetry padroniza traces e logs sem acoplar o dominio a um backend."
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: delivery-observability-infra
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker-compose
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: recorded
  principles:
    coupling_rule: "Dominio e casos de uso nao importam FastAPI, OpenTelemetry, Prometheus, storage, broker ou cloud SDK."
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: "Usar um monolito modular e adicionar apenas backends que provam metricas, traces, logs e navegacao entre sinais."
    testability_rule: "ObservationService recebe IncidentStore e Clock; telemetria e composta no adapter HTTP."
    rejected_overengineering:
      - "Microservicos e broker foram rejeitados porque nao ha fan-out, fila ou deploy independente."
      - "Banco foi rejeitado porque persistencia nao participa do claim."
  stack_profile: fastapi-backend
  api_style: rest-http
  messaging: none
  cloud:
    mode: local-first
    local_provider: docker-compose
    real_provider_target: pluggable-otlp-backend
    emulated_services: []
    adapter_rule: "A aplicacao fala OTLP; Collector e backends podem ser trocados sem mudar dominio ou casos de uso."
    config_switch: OTEL_EXPORTER_OTLP_ENDPOINT
    unsupported_behaviors:
      - "Nenhuma paridade com SLO, retencao ou alta disponibilidade de producao e alegada."
  database: none
  runtime: "Python 3.12.13 sem root; Compose fixa imagens por tag e digest."
  library_policy: "Dependencias Python diretas sao fixadas; integracoes externas usam OTLP e configuracao, nao imports no dominio."
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: "Apenas Prometheus e Grafana"
      reason: "Nao provaria correlacao entre metricas, traces e logs."
    - option: "Kafka ou RabbitMQ"
      reason: "Nao existe requisito de mensageria neste fluxo sincrono."
architecture:
  style: hexagonal-modular-monolith
  reason: "O incidente e um unico dominio pequeno; portas isolam estado e tempo, enquanto HTTP e telemetria ficam nos adapters."
  problem_forces:
    domain_complexity: low
    integration_pressure: high
    ui_state_complexity: none
    data_or_ml_reproducibility: high
    auditability: high
    throughput_or_async: low
    independent_deployability: low
  dependency_rule: "Dependencias apontam para dentro; backends observaveis recebem sinais por OTLP ou scrape."
  boundaries:
    - "domain.py: identidade, invariantes e transicoes imutaveis"
    - "application.py: casos de uso sobre IncidentStore e Clock"
    - "infrastructure: store, metricas e telemetria"
    - "api.py: composicao HTTP e correlacao"
    - "benchmark.py: consumidor externo fail-closed"
  rejected_alternatives:
    - style: microservices
      reason: "Distribuicao adicionaria falhas sem aumentar a evidencia dos sinais."
    - style: event-driven
      reason: "Nao ha processamento assincrono ou fan-out."
design_system:
  tokens: .portfolio/design-system/tokens.yaml
  readme_components:
    - readme_header
    - benchmark_card
    - architecture_card
    - references_table
  diagram_required: true
reuse:
  kit_version: local
  uses:
    - catalog
    - programs
    - component-packs
    - openspec-schema
    - decision-brain
    - agent-graph
    - reuse-improvement-loop
    - architecture
    - language-profiles
    - design-system
    - sdd
    - harness
    - templates
    - skills
benchmark:
  primary_metric: incident_recovery_seconds
  unit: seconds
  command: "docker compose -f docker-compose.evidence.yml up --build --abort-on-container-exit --exit-code-from benchmark; docker compose -f docker-compose.evidence.yml cp benchmark:/output/observability-stack-v1.json benchmarks/results/observability-stack-v1.json"
  result_path: benchmarks/results/observability-stack-v1.json
  publication_result_path: benchmarks/publication/observability-stack-v2.json
release:
  docker: "docker compose up --build"
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
  evidence_source_commit: 2b289f4554d5f976f45d0126816d93490811f34d
  evidence_image_digest: sha256:a28b8b6e2f27aa4ed1d06c905bf59dc1448704b834c68bfffe590fd1c52b25a6
  evidence_image_size_bytes: 144984285
