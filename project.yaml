id: 25
name: observability-stack
program:
  id: backend-reliability-platform
  narrative_fit: "Demonstra uma API operavel com falha controlada, sinais Prometheus e evidencia reproduzivel de deteccao e recuperacao."
  shared_assets:
    - "Contrato de benchmark JSON do portfolio"
status: benchmarked
claim: observabilidade ponta a ponta
stack:
  - python-3.12
  - fastapi
  - prometheus-client
  - prometheus
  - grafana
  - docker-compose
language_profile:
  primary: fastapi-backend
  secondary: []
  reason: "FastAPI fornece uma API HTTP pequena e documentada; Python permite manter o benchmark deterministico no mesmo codigo de aplicacao."
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: backend-reliability-platform
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker-compose
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: recorded
  principles:
    coupling_rule: "Dominio e casos de uso nao dependem de framework, banco, broker, cloud SDK, transporte ou UI."
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: "Escolher a menor implementacao que prove o claim e rejeitar infraestrutura sem evidencia de necessidade."
    testability_rule: "ObservationService recebe IncidentStore e Clock, portanto roda sem HTTP, Prometheus ou Docker."
    rejected_overengineering:
      - "Microservicos, broker e banco foram rejeitados por nao contribuirem para o benchmark local."
  stack_profile: fastapi-backend
  api_style: rest-http
  messaging: none
  cloud:
    mode: none
    local_provider: none
    real_provider_target: none
    emulated_services: []
    adapter_rule: "Nao ha dependencia cloud; qualquer integracao futura deve entrar por um port e um adapter fora do dominio."
    config_switch: CLOUD_PROVIDER=none
    unsupported_behaviors: []
  database: none
  runtime: "Python 3.12 slim com Uvicorn; um processo local e suficiente para a demonstracao."
  library_policy: "FastAPI, prometheus-client e Uvicorn sao dependencias diretas do sinal demonstrado; httpx suporta o teste do contrato HTTP."
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: "Go + OpenTelemetry Collector"
      reason: "Aumentaria a superficie do scaffold sem melhorar o benchmark de MTTR simulado."
    - option: "Kumo ou AWS"
      reason: "O exemplo nao possui capacidade cloud; adicionar um provider seria infraestrutura sem valor para o claim."
architecture:
  style: hexagonal
  reason: "O caso de uso de incidente e checkout e pequeno, mas precisa provar desacoplamento entre politica, armazenamento, HTTP e metricas. Hexagonal torna essa fronteira visivel e testavel."
  problem_forces:
    domain_complexity: low
    integration_pressure: medium
    ui_state_complexity: none
    data_or_ml_reproducibility: high
    auditability: medium
    throughput_or_async: low
    independent_deployability: low
  dependency_rule: "Dominio e aplicacao nao importam FastAPI, Prometheus, banco, broker ou cloud; adapters dependem dos ports internos."
  boundaries:
    - "domain.py: estado imutavel e transicoes de incidente"
    - "application.py: casos de uso e ports"
    - "infrastructure: armazenamento em memoria e metricas Prometheus"
    - "api.py: adapter HTTP e contratos Pydantic"
  rejected_alternatives:
    - style: microservices
      reason: "Um unico processo local prova o fluxo com menor custo operacional e sem inventar distribuicao."
    - style: event-driven
      reason: "Nao ha fan-out ou processamento assincrono que justifique broker para este benchmark."
design_system:
  tokens: .portfolio/design-system/tokens.yaml
  readme_components:
    - readme_header
    - benchmark_card
    - architecture_card
    - references_table
  diagram_required: true
reuse:
  kit_version: local
  uses:
    - catalog
    - programs
    - proficiency-map
    - component-packs
    - openspec-schema
    - decision-brain
    - agent-graph
    - reuse-improvement-loop
    - architecture
    - language-profiles
    - design-system
    - sdd
    - harness
    - templates
    - skills
benchmark:
  primary_metric: simulated_mttr_minutes
  unit: minutes
  command: "PYTHONPATH=src python -m observability_stack.benchmark --output benchmarks/results/observability-stack-v1.json"
  result_path: benchmarks/results/observability-stack-v1.json
release:
  docker: "docker compose up --build"
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
