[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "observability-stack"
version = "1.0.0"
description = "Local-first observability demo with a controlled incident"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "prometheus-client==0.21.1",
  "uvicorn[standard]==0.34.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
